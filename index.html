<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Test Page</title>
  <style>
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: #f5f6f8;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 3rem auto;
      padding: 2rem 2.5rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    p {
      color: #555;
    }
    ul {
      list-style: none;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    li {
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .pass { background: #e3f6e8; color: #1e7b34; }
    .hold { background: #fff4d6; color: #8a6100; }
    .fail { background: #fde4e4; color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Claude Code Test Page</h1>
    <p>This is a test repository for Claude Code experiments. It's used to try out ideas, workflows, and changes in a safe place.</p>
    <h2>Result Categories</h2>
    <ul>
      <li class="pass">Pass</li>
      <li class="hold">Hold</li>
      <li class="fail">Fail</li>
    </ul>
  </main>
</body>
</html>
